services:
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "18000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - HOST=0.0.0.0
      - PORT=8000
      - ORCHESTRATOR_API_KEY=${ORCHESTRATOR_API_KEY:-}
      - ORCHESTRATOR_SECRET=${ORCHESTRATOR_SECRET:-}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-7}
      - CIRCUIT_FAILURE_THRESHOLD=${CIRCUIT_FAILURE_THRESHOLD:-3}
      - CIRCUIT_RESET_INITIAL=${CIRCUIT_RESET_INITIAL:-5}
      - ALERT_REPEAT_SECONDS=${ALERT_REPEAT_SECONDS:-900}
      - CIRCUIT_RESET_TIMEOUT=${CIRCUIT_RESET_TIMEOUT:-60}
      - CIRCUIT_DEGRADED_THRESHOLD=${CIRCUIT_DEGRADED_THRESHOLD:-1}
      - SERVICE_SCHEME=${SERVICE_SCHEME:-http}
      - ALLOW_INLINE=${ALLOW_INLINE:-true}
      - MAX_INLINE_BYTES=${MAX_INLINE_BYTES:-65536}
      - MAX_ERROR_CHARS=${MAX_ERROR_CHARS:-500}
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Shared by API and workers: each process writes its own log and alert
      # files, and the dashboard (served by the API) reads them all.
      - orchestrator_logs:/app/src/logs

  worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "worker_daemon.py"]
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_POLL_INTERVAL=1.0
      - ORCHESTRATOR_API_KEY=${ORCHESTRATOR_API_KEY:-}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-7}
      - CIRCUIT_FAILURE_THRESHOLD=${CIRCUIT_FAILURE_THRESHOLD:-3}
      - CIRCUIT_RESET_INITIAL=${CIRCUIT_RESET_INITIAL:-5}
      - ALERT_REPEAT_SECONDS=${ALERT_REPEAT_SECONDS:-900}
      - CIRCUIT_RESET_TIMEOUT=${CIRCUIT_RESET_TIMEOUT:-60}
      - CIRCUIT_DEGRADED_THRESHOLD=${CIRCUIT_DEGRADED_THRESHOLD:-1}
      - BLOCKED_TASK_RETRY_INITIAL=${BLOCKED_TASK_RETRY_INITIAL:-2}
      - BLOCKED_TASK_RETRY_DELAY=${BLOCKED_TASK_RETRY_DELAY:-30}
      - BLOCKED_TASK_MAX_AGE=${BLOCKED_TASK_MAX_AGE:-0}
      - TASK_MAX_RUNTIME=${TASK_MAX_RUNTIME:-3600}
      - LEASE_SECONDS=${LEASE_SECONDS:-300}
      - ORCHESTRATOR_SECRET=${ORCHESTRATOR_SECRET:-}
      - SERVICE_SCHEME=${SERVICE_SCHEME:-http}
      - SERVICE_TLS_VERIFY=${SERVICE_TLS_VERIFY:-true}
      - ALLOW_INLINE=${ALLOW_INLINE:-true}
      - MAX_INLINE_BYTES=${MAX_INLINE_BYTES:-65536}
      - MAX_ERROR_CHARS=${MAX_ERROR_CHARS:-500}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 3
    networks:
      - default
      - services
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Shared by API and workers: each process writes its own log and alert
      # files, and the dashboard (served by the API) reads them all.
      - orchestrator_logs:/app/src/logs

volumes:
  orchestrator_logs:

networks:
  services:
    name: ai-effect-services
    external: true
