<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestrator Dashboard</title>
<!--
  Orchestrator dashboard, served by the API at /ui.
-->
<link rel="stylesheet" href="index.css">
</head>
<body>
<header>
  <h1>Orchestrator</h1>
  <span id="online" class="pill">checking…</span>
  <label class="small">API key <input id="apikey" type="password" placeholder="only if ORCHESTRATOR_API_KEY is set" autocomplete="off"></label>
  <span id="message" class="small"></span>
</header>

<main>
  <div class="stack">
    <section>
      <h2>Workflows</h2>
      <ul id="workflows" class="list"><li class="empty">Loading…</li></ul>
    </section>
    <section>
      <h2>Services</h2>
      <div id="services" class="empty">Loading…</div>
    </section>
  </div>

  <div class="stack">
    <section>
      <h2 id="wf-title">Select a workflow</h2>
      <div id="graph" class="graph"></div>
      <div id="tasks"></div>
    </section>
    <section>
      <h2>Verification</h2>
      <div id="verify" class="empty">Select a workflow.</div>
    </section>
    <section>
      <h2>Logs</h2>
      <pre id="logs" class="mono">Select a workflow to see its log lines.</pre>
    </section>
    <section>
      <h2>Recent alerts</h2>
      <div id="alerts" class="empty">Loading…</div>
    </section>
  </div>
</main>

<script src="index.js"></script>
</body>
</html>
